<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Saigon 1975 · sessão na mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  #tela { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
  .fonte-oculta { position: absolute; left: -9999px; top: -9999px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
  <canvas id="tela" width="1920" height="1080"></canvas>
  <span class="fonte-oculta" style="font-family: 'Permanent Marker'; font-weight: 800;">Permanent Marker ÁÇÃ</span>
</div>
<script type="module">
  import { style } from './estilo.js';
  const tema = { ...style.theme, font: 'Permanent Marker' };
  const canvas = document.getElementById('tela');
  const ctx = canvas.getContext('2d', { alpha: false });
  const W = 1920, H = 1080, DUR = 15;
  function desenha(t) {
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
    ctx.fillStyle = tema.bg; ctx.fillRect(0, 0, W, H);
    style.render(ctx, t, tema, W, H);
    ctx.restore();
  }
  window.seek = (t) => desenha(t);
  // relógio único: uma timeline pausada (HyperFrames) e o seek do render por GPU chamam a mesma função pura de t
  const p = { t: 0 };
  if (window.gsap) { const tl = gsap.timeline({ paused: true }); tl.to(p, { t: DUR, duration: DUR, ease: 'none', onUpdate: () => desenha(p.t) }, 0); window.__timelines = window.__timelines || {}; window.__timelines.main = tl; }
  try {
    await Promise.race([document.fonts.load("800 40px 'Permanent Marker'", 'ÁÇÃ0123456789'), new Promise((r) => setTimeout(r, 6000))]);
    await document.fonts.ready;
  } catch (e) {}
  window.__fonteOk = document.fonts.check("800 40px 'Permanent Marker'");
  try { desenha(0); window.__ready = true; } catch (e) { window.__error = String(e && e.stack || e); }
</script>
</body>
</html>
