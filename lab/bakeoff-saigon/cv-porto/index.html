<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #gl, #ov { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
  #veu { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #160d14; pointer-events: none; }
  #fonte { position: absolute; left: -9999px; font: 700 40px 'Barlow Condensed'; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <canvas id="ov" width="1920" height="1080"></canvas>
  <div id="veu"></div>
  <span id="fonte">Aa</span>
</div>
<script src="cena.js"></script>
<script src="motor.js"></script>
</body>
</html>
