<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de cenas</title>
<style>
:root{--bg:#0e1013;--card:#171a1f;--card2:#1f232a;--tx:#e8eaed;--mut:#9aa0a8;--line:#2a2f37;
  --ok:#3fb56b;--rev:#e0a72e;--bad:#e5534b;--falta:#5b616b;--acc:#5aa9ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#061018;border-color:var(--acc);font-weight:600}
button:disabled{opacity:.4;cursor:default}
#topo{padding:10px 16px;border-bottom:1px solid var(--line);display:grid;gap:3px}
#topo .l{display:flex;gap:8px;min-width:0}
#topo .k{color:var(--mut);flex:0 0 auto;width:120px}
#topo .v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#topo .v.espera{color:var(--rev);font-weight:600}
#barra{position:sticky;top:0;z-index:5;background:#0e1013ee;backdrop-filter:blur(6px);padding:8px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#barra .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#barra label{color:var(--mut);display:flex;gap:4px;align-items:center}
.leg{display:flex;gap:10px;color:var(--mut);font-size:12px;margin-left:auto;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
#palco{display:grid;gap:12px;padding:12px 16px}
#palco:empty{display:none}
.cel{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.rot{font:700 22px/1.2 ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding:8px 12px;background:#000;color:#fff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rot .ver{color:#ffd166}.rot .tm{color:#7fd1ff}
.cel video{width:100%;display:block;background:#000;aspect-ratio:16/9}
.corpo{display:grid;grid-template-columns:1fr;min-width:0}
.um .corpo{grid-template-columns:minmax(0,1fr) 320px}
.notas{padding:10px 12px;font-size:13px;color:var(--mut);border-top:1px solid var(--line)}
.um .notas{border-top:0;border-left:1px solid var(--line);max-height:none}
.notas b{color:var(--tx)}
.notas .df{margin:6px 0;padding-left:8px;border-left:3px solid var(--bad);color:var(--tx)}
.notas .df span{color:var(--mut)}
.notas .txt{margin-top:8px;font-style:italic}
.cel .acoes{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line)}
#grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding:12px 16px 40px}
.card{background:var(--card);border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;position:relative}
.card.sel{border-color:var(--acc)}
.card img,.card .sem{width:100%;aspect-ratio:16/9;display:block;object-fit:cover;background:#000}
.card .sem{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px}
.card .info{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;gap:6px}
.card .id{font-weight:700}
.card .du{color:var(--mut);font-size:12px}
.card .faixa{height:5px}
.card .n{position:absolute;top:6px;left:6px;background:var(--acc);color:#061018;font-weight:700;border-radius:10px;padding:0 7px;font-size:12px}
.card .vx{position:absolute;top:6px;right:6px;background:#000c;color:#ffd166;border-radius:4px;padding:0 5px;font-size:11px}
.s-aprovada{background:var(--ok)}.s-revisao{background:var(--rev)}.s-reprovada{background:var(--bad)}.s-falta{background:var(--falta)}
#dica{color:var(--mut);font-size:12px;padding:0 16px}
kbd{background:var(--card2);border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:11px}
@media (max-width:760px){
  #palco{grid-template-columns:1fr!important}
  .um .corpo{grid-template-columns:1fr}
  .um .notas{border-left:0;border-top:1px solid var(--line)}
  .rot{font-size:18px}
  #topo .k{width:92px}
  #topo .v{white-space:normal}
  #grade{grid-template-columns:repeat(2,minmax(0,1fr))}
  .leg{margin-left:0}
}
</style>
</head>
<body>
<div id="topo">
  <div class="l"><span class="k">Rodando agora</span><span class="v" id="agora">…</span></div>
  <div class="l"><span class="k">Espera você</span><span class="v" id="espera">…</span></div>
  <div class="l"><span class="k">Próximo passo</span><span class="v" id="proximo">…</span></div>
</div>
<div id="barra">
  <span id="lotes"></span>
  <span class="sep"></span>
  <button id="bPlay">▶ Tocar juntas</button>
  <button id="bPause">❚❚ Pausar</button>
  <button id="bZero">⟲ Início</button>
  <button id="bLimpar">✕ Fechar</button>
  <label><input type="checkbox" id="som" checked> som só da 1ª</label>
  <span class="leg"><span><i class="s-aprovada"></i>aprovada</span><span><i class="s-revisao"></i>em revisão</span><span><i class="s-reprovada"></i>reprovada</span><span><i class="s-falta"></i>falta render</span></span>
</div>
<div id="dica">Clique nas miniaturas para abrir (várias = lado a lado). Teclas: <kbd>espaço</kbd> tocar/pausar · <kbd>←</kbd><kbd>→</kbd> 1 quadro · <kbd>,</kbd><kbd>.</kbd> 0,5 s</div>
<div id="palco"></div>
<div id="grade"></div>
<script>
"use strict";
const FPS = 30;
let S = {scenes: [], lotes: []};
let lote = "todos";
let sel = [];            // itens no palco: {sid, v}
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const cena = sid => S.scenes.find(s => s.id === sid);
const fmt = t => { const d = Math.floor((t || 0) * 10 + 1e-6); const m = Math.floor(d / 600), s = Math.floor(d / 10) % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") + "." + (d % 10); };

async function carregar() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    S = await r.json();
  } catch (e) { $("agora").textContent = "Painel sem conexão com o servidor."; return; }
  $("agora").textContent = S.agora || "nada registrado";
  $("agora").title = S.agora || "";
  const esp = S.espera.length ? S.espera.join(" · ") : "nada";
  $("espera").textContent = esp; $("espera").className = "v" + (S.espera.length ? " espera" : "");
  $("proximo").textContent = S.proximo || "—"; $("proximo").title = S.proximo || "";
  desenharLotes(); desenharGrade();
}

function desenharLotes() {
  const ids = ["todos"].concat(S.lotes.map(l => l.id));
  $("lotes").innerHTML = ids.map(i => '<button data-l="' + i + '" class="' + (i === lote ? "on" : "") + '">' + (i === "todos" ? "Todas" : i) + "</button>").join(" ");
  $("lotes").querySelectorAll("button").forEach(b => b.onclick = () => { lote = b.dataset.l; desenharLotes(); desenharGrade(); });
}

function desenharGrade() {
  const lista = S.scenes.filter(s => lote === "todos" || s.lote === lote);
  $("grade").innerHTML = lista.map(s => {
    const idx = sel.findIndex(x => x.sid === s.id);
    const temFinal = s.versoes.some(v => v.v === "final");
    const img = temFinal ? '<img loading="lazy" src="/thumb/' + s.id + '.jpg?m=' + encodeURIComponent((s.versoes[0] || {}).at || "") + '" alt="' + s.id + '">' : '<div class="sem">sem render</div>';
    return '<div class="card' + (idx >= 0 ? " sel" : "") + '" data-s="' + s.id + '" title="' + esc(s.texto) + '">' + img +
      (idx >= 0 ? '<span class="n">' + (idx + 1) + "</span>" : "") +
      (s.versoes.length > 1 ? '<span class="vx">' + s.versoes.length + " versões</span>" : "") +
      '<div class="faixa s-' + s.status + '"></div><div class="info"><span class="id">' + s.id + '</span><span class="du">' + s.dur.toFixed(1) + " s · " + esc(s.lote) + "</span></div></div>";
  }).join("");
  $("grade").querySelectorAll(".card").forEach(c => c.onclick = () => alternar(c.dataset.s));
}

function alternar(sid) {
  const s = cena(sid); if (!s || !s.versoes.length) return;
  const i = sel.findIndex(x => x.sid === sid);
  if (i >= 0) sel.splice(i, 1); else sel.push({sid, v: s.versoes[0].v});
  montarPalco(); desenharGrade();
  if (sel.length) window.scrollTo({top: $("palco").offsetTop - 50, behavior: "smooth"});
}

function comparar(sid) {
  const s = cena(sid);
  sel = s.versoes.map(v => ({sid, v: v.v}));
  montarPalco(); desenharGrade();
}

function notasHTML(s) {
  const r = s.review;
  let h = "";
  if (!r) h = "<b>Sem revisão ainda.</b>";
  else {
    h = "<b>Revisão c" + esc(String(r.ciclo == null ? "?" : r.ciclo).replace(/^c/, "")) + ": média " + esc(r.media) + " · " + esc(r.veredito) + "</b> (" + r.n_defeitos + " defeitos)";
    h += r.defeitos.map(d => '<div class="df"><span>' + esc(d.tempo) + " · " + esc(d.prioridade) + "</span><br>" + esc(d.texto) + "</div>").join("");
  }
  return h + '<div class="txt">“' + esc(s.texto) + "”</div>";
}

function montarPalco() {
  location.replace("#" + sel.map(x => x.sid + (x.v !== "final" ? "~" + encodeURIComponent(x.v) : "")).join(","));
  const p = $("palco");
  p.innerHTML = "";
  p.className = sel.length === 1 ? "um" : "";
  const cols = sel.length === 4 ? 2 : Math.min(Math.max(sel.length, 1), 3);
  p.style.gridTemplateColumns = "repeat(" + cols + ",minmax(0,1fr))";
  sel.forEach((it, i) => {
    const s = cena(it.sid); const v = s.versoes.find(x => x.v === it.v) || s.versoes[0];
    const c = document.createElement("div");
    c.className = "cel" + (sel.length === 1 ? " um" : "");
    c.innerHTML = '<div class="rot"><span class="id">' + s.id + '</span> · <span class="ver">' + esc(v.v) + '</span> · <span class="tm">00:00.0</span></div>' +
      '<div class="corpo"><div><video src="' + v.url + '" controls preload="auto" playsinline></video></div>' +
      '<div class="notas">' + notasHTML(s) + "</div></div>" +
      '<div class="acoes">' + (s.versoes.length > 1 ? '<button data-c="' + s.id + '">comparar versões (' + s.versoes.length + ")</button>" : "") +
      '<button data-x="' + i + '">fechar ' + s.id + "</button><span style=\"color:var(--mut);font-size:12px;align-self:center\">render " + esc(v.at) + "</span></div>";
    p.appendChild(c);
    const vid = c.querySelector("video"), tm = c.querySelector(".tm");
    const upd = () => { tm.textContent = fmt(vid.currentTime); };
    vid._upd = upd;
    ["timeupdate", "pause", "seeked", "seeking", "loadedmetadata"].forEach(e => vid.addEventListener(e, upd));
    if (i === 0) {
      vid.addEventListener("seeked", () => { if (vid.paused) alinhar(); });
      vid.addEventListener("play", () => { todos().slice(1).forEach(x => { if (x.paused) { x.currentTime = Math.min(vid.currentTime, x.duration || 1e9); x.play().catch(() => {}); } }); laco(); });
      vid.addEventListener("pause", () => todos().slice(1).forEach(x => x.pause()));
    }
  });
  p.querySelectorAll("[data-c]").forEach(b => b.onclick = () => comparar(b.dataset.c));
  p.querySelectorAll("[data-x]").forEach(b => b.onclick = () => { sel.splice(+b.dataset.x, 1); montarPalco(); desenharGrade(); });
  somSo();
}

const todos = () => [...$("palco").querySelectorAll("video")];
function somSo() { const so = $("som").checked; todos().forEach((x, i) => x.muted = so && i > 0); }
function alinhar() { const v = todos(); if (!v.length) return; const t = v[0].currentTime;
  v.slice(1).forEach(x => { const alvo = Math.min(t, (x.duration || 1e9) - 0.001); if (Math.abs(x.currentTime - alvo) > 0.001) x.currentTime = alvo; }); }
let rodando = false;
function laco() {
  if (rodando) return; rodando = true;
  const passo = () => {
    const v = todos();
    v.forEach(x => x._upd && x._upd());
    // corrige deriva entre vídeos (mais de 2 quadros)
    if (v.length > 1 && !v[0].paused) v.slice(1).forEach(x => { if (!x.paused && !x.ended && v[0].currentTime < x.duration && Math.abs(x.currentTime - v[0].currentTime) > 2 / FPS) x.currentTime = v[0].currentTime; });
    if (v.some(x => !x.paused)) requestAnimationFrame(passo); else rodando = false;
  };
  requestAnimationFrame(passo);
}
function tocar() { const v = todos(); if (!v.length) return; const t = v[0].ended ? 0 : v[0].currentTime;
  v.forEach(x => { x.currentTime = Math.min(t, x.duration || 1e9); x.play().catch(() => {}); }); laco(); }
function pausar() { todos().forEach(x => x.pause()); alinhar(); }
function mover(d) { const v = todos(); if (!v.length) return; pausar();
  const t = Math.max(0, v[0].currentTime + d); v.forEach(x => { x.currentTime = Math.min(t, (x.duration || 1e9) - 0.001); }); }

$("bPlay").onclick = tocar; $("bPause").onclick = pausar;
$("bZero").onclick = () => { pausar(); todos().forEach(x => x.currentTime = 0); };
$("bLimpar").onclick = () => { sel = []; montarPalco(); desenharGrade(); };
$("som").onchange = somSo;
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea,select")) return;
  if (!todos().length) return;
  const k = e.key;
  if (k === " ") { e.preventDefault(); todos()[0].paused ? tocar() : pausar(); }
  else if (k === "ArrowRight") { e.preventDefault(); mover(1 / FPS); }
  else if (k === "ArrowLeft") { e.preventDefault(); mover(-1 / FPS); }
  else if (k === ".") { e.preventDefault(); mover(0.5); }
  else if (k === ",") { e.preventDefault(); mover(-0.5); }
});

(async () => {
  await carregar();
  const h = decodeURIComponent(location.hash.slice(1));
  if (h) { sel = h.split(",").map(x => { const [sid, v] = x.split("~"); const s = cena(sid); return s && s.versoes.length ? {sid, v: v || s.versoes[0].v} : null; }).filter(Boolean); montarPalco(); desenharGrade(); }
  setInterval(carregar, 20000);
})();
</script>
</body>
</html>
